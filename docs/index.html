<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spotlight</title>
<meta name="description" content="Spotlight lives at spotlighthub.vercel.app." />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    color: #e8e1d8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    position: relative;
    overflow: hidden;
  }
  /* Same height as .waves below, on purpose: this is the "black area" the
     wave doesn't cover, and centering main inside exactly that box (rather
     than the full viewport) is what puts it in the middle of that region
     instead of the middle of the whole page. */
  .content-area {
    position: relative;
    z-index: 2;
    height: calc(100vh - 45vh);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .waves {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 45vh;
    z-index: 1;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .waves path { animation: none !important; }
  }
  /* Ported from src/components/intro/Meteors.tsx + the .intro-meteor rules in
     src/index.css (the app's own welcome-screen background) — same look, no
     React: plain spans placed by a few lines of vanilla JS below. */
  .meteors {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .meteor {
    position: absolute;
    top: -5%;
    height: 2px;
    width: 2px;
    border-radius: 9999px;
    background: rgba(232, 225, 216, 0.9);
    box-shadow: 0 0 0 1px rgba(217, 189, 143, 0.15), 0 0 8px rgba(217, 189, 143, 0.6);
    rotate: var(--meteor-angle, -215deg);
    animation: meteor linear infinite;
  }
  .meteor-tail {
    position: absolute;
    top: 50%;
    left: 0;
    height: 1px;
    width: 60px;
    transform: translateY(-50%);
    background: linear-gradient(to right, rgba(217, 189, 143, 0.8), transparent);
  }
  @keyframes meteor {
    0% { transform: rotate(var(--meteor-angle)) translateX(0); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: rotate(var(--meteor-angle)) translateX(-80vh); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .meteor { animation: none; opacity: 0; }
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    max-width: 420px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  p {
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    color: #a8a29a;
  }
  a.button {
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 999px;
    background: #e8b04b;
    color: #000;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    transition: filter 0.15s ease;
  }
  a.button:hover, a.button:focus-visible {
    filter: brightness(1.1);
  }
  .repo-link {
    margin-top: 8px;
    font-size: 12px;
  }
  .repo-link a {
    color: #a8a29a;
  }
</style>
</head>

  <script>
    // Mirrors Meteors.tsx's defaults for the intro screen (number=21,
    // minDuration=3, maxDuration=9; angle/delay left at the component's own
    // defaults of 215deg / 0.2-1.2s) -- same look, no React needed for 21 spans.
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var container = document.getElementById("meteors");
      var count = 21, angle = 215, minDelay = 0.2, maxDelay = 1.2, minDuration = 3, maxDuration = 9;
      for (var i = 0; i < count; i++) {
        var meteor = document.createElement("span");
        meteor.className = "meteor";
        meteor.style.setProperty("--meteor-angle", -angle + "deg");
        meteor.style.left = (Math.random() * 100) + "%";
        meteor.style.animationDelay = (Math.random() * (maxDelay - minDelay) + minDelay) + "s";
        meteor.style.animationDuration = Math.floor(Math.random() * (maxDuration - minDuration) + minDuration) + "s";
        var tail = document.createElement("span");
        tail.className = "meteor-tail";
        meteor.appendChild(tail);
        container.appendChild(meteor);
      }
    })();
  </script>
