name: OTT Radar

on:
  schedule:
    # 2:00 PM IST (8:30 UTC) every Wednesday and Friday
    - cron: "30 8 * * 3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip Telegram/email, still refresh Postgres)"
        type: boolean
        default: false

concurrency:
  group: ott-radar
  cancel-in-progress: false

jobs:
  send-release-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OTT Radar
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          TELEGRAM_ENABLED: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ENABLED: "false"
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SEND_BROADCAST_DIGEST: "false"
          NOTIFY_OWNER_EMAILS: ${{ vars.NOTIFY_OWNER_EMAILS }}
          REGION: IN
          LANGUAGES: hi,en
          POPULAR_MIN_POPULARITY: "25"
          RELEASE_TIMEZONE: Asia/Kolkata
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python releasebot.py

      # Asks Release Pulse to refill its board cache now that the release data
      # is fresh. Optional and best effort: a sleeping container or a missing
      # secret must never fail the release run, and until Pulse is deployed and
      # configured this step does nothing at all.
      - name: Warm Release Pulse board
        continue-on-error: true
        timeout-minutes: 5
        env:
          PULSE_WARM_SECRET: ${{ secrets.PULSE_WARM_SECRET }}
          PULSE_URL: ${{ vars.PULSE_URL }}
        run: |
          if [ -z "$PULSE_WARM_SECRET" ] || [ -z "$PULSE_URL" ]; then
            echo "Pulse warm skipped (not configured)"
            exit 0
          fi
          curl -fsS --max-time 30 -X POST -H "Authorization: Bearer $PULSE_WARM_SECRET" "$PULSE_URL/warm"
