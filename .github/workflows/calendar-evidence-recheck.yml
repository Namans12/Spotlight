name: Calendar evidence recheck

on:
  workflow_dispatch: {}

concurrency:
  group: ott-radar
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Confirm exact regional theatrical dates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/recheck_calendar_evidence.py --region IN --limit 200 --apply
      - name: Confirm global TV first-air dates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/recheck_global_tv.py --limit 300 --apply
