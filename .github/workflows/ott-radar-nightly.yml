name: OTT Radar Nightly Refresh

on:
  schedule:
    # 2:00 AM IST (20:30 UTC previous day) every day
    - cron: "30 20 * * *"
  workflow_dispatch: {}

concurrency:
  group: ott-radar
  cancel-in-progress: false

jobs:
  nightly-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OTT Radar (DB write only, no notifications)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: "true"
          REGION: IN
          LANGUAGES: hi,en
          POPULAR_MIN_POPULARITY: "25"
          RELEASE_TIMEZONE: Asia/Kolkata
        run: python releasebot.py

      # Fills the title_ratings cache so poster grids can read IMDb/RT without
      # ever calling OMDb themselves. Capped per run to stay inside OMDb's free
      # 1,000/day, and a no-op when OMDB_API_KEY is absent.
      - name: Backfill IMDb / Rotten Tomatoes ratings
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RATINGS_MAX_CALLS: "400"
        run: python scripts/backfill_ratings.py

      # Fills the title_seasons cache so TV cards can show "8 Seasons" etc.
      # without ever calling TMDB themselves. TMDB's own limits are generous,
      # but capped per run anyway for the same reason ratings is: a cron step
      # should never be able to turn into an unbounded loop.
      - name: Backfill TV season counts
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEASONS_MAX_CALLS: "400"
        run: python scripts/backfill_seasons.py

      # Rebuilds Must Watch / Can Watch edges from TMDB collections, under the
      # classification in data/collection-shapes.json (a continuous series, a
      # multi-arc saga, or an anthology that gets no prerequisites at all).
      #
      # This was never in CI, which meant every edge in production came from
      # the request-path warm in api/relations.ts and the curated seed was only
      # as fresh as the last time someone ran it by hand. Idempotent and
      # precedence-guarded: a re-run over unchanged data writes nothing, and a
      # lower-trust source can never overwrite a higher-trust one.
      - name: Sync watch-order edges from TMDB collections
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/sync_relations_tmdb.py --limit 500

      # Loads the hand-authored continuity in data/relations_seed.json — the
      # cross-franchise ordering (MCU, Star Wars TV) that no structured source
      # gets right, and the only watch-order data this app has for shows.
      # Runs after the TMDB sync deliberately: 'tmdb' outranks 'seed' in the
      # precedence ladder, so ordering here changes nothing, but reading the
      # seed's report against a just-synced table makes a conflict visible.
      - name: Load curated watch-order seed
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/seed_relations.py

      # Keeps calendar_entries populated past whatever the one-time editorial
      # CSV covered. Region-aware theatrical dates + TV premieres (scoped to
      # --tv-countries to avoid TMDB's crowdsourced global noise), idempotent,
      # and enrich-only against any hand-curated row.
      - name: Sync upcoming calendar from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/sync_calendar_tmdb.py --months 6

      # Regional Indian theatrical releases TMDB's own discover feed misses
      # almost entirely — a spot-check of one real Friday found 8 of 16 films
      # playing in Hyderabad cinemas absent from TMDB or dateless there.
      # district.in's per-city listings cover the gap in principle, but in
      # practice this step is currently a no-op IN CI: confirmed by dispatch
      # that district.in 403s every request from a GitHub-hosted runner (an
      # Akamai IP/ASN block, not a header fingerprint — a full browser header
      # set and a cookie warm-up still 403, even on the plain homepage).
      # Left in rather than removed: harmless when blocked, and would start
      # working again for free if the block lifts or this job ever moves to
      # a self-hosted runner. The Wikipedia step below is what actually
      # covers this gap today. Runs before the TMDB linker so any new row
      # either step adds gets a chance at a poster too.
      - name: Sync regional theatrical releases from district.in
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/sync_theatrical_district.py

      # The real source for the gap above, since district.in is blocked from
      # every GitHub-hosted runner (see previous step). Wikipedia's
      # per-language "List of X films of YYYY" pages aren't blocked the same
      # way. Narrower coverage than district.in's (only languages with a
      # dedicated per-year Wikipedia page — no Punjabi, no Bengali) and mixes
      # in straight-to-OTT titles the script filters out by studio name; see
      # sync_theatrical_wikipedia.py's own docstring for both caveats.
      - name: Sync regional theatrical releases from Wikipedia
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/sync_theatrical_wikipedia.py

      # Links any calendar row still missing a tmdb_id (only ever the
      # editorial CSV rows, or a future manual reseed) so it gets a poster and
      # becomes clickable. Matches on exact folded title + release year;
      # anything less confident is left alone rather than risk a wrong poster
      # on a release calendar. No-op when everything is already linked.
      - name: Link calendar entries to TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backfill_calendar_tmdb.py

      # Checks every already-linked row against TMDB's CURRENT data — a link
      # made correctly can still go wrong later: TMDB renames a record
      # (found happening mid-session to "Khalifa Part 1"), or its
      # `original_language` disagrees with what every other write path in
      # this app treats as ground truth. Also unlinks a title that no longer
      # matches at all and whose date doesn't corroborate it either — a real,
      # if rare, wrong match. Two known-bad TMDB records and one known-wrong
      # TMDB language are excluded via a hardcoded override inside the
      # script itself (documented there) so a fix made by hand doesn't get
      # silently re-broken by this same step the next night.
      - name: Verify calendar TMDB links are still correct
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/verify_calendar_tmdb_links.py

      # calendar_entries is unique on (release_date, title, entry_type), not
      # tmdb_id — two rows (a CSV-seeded one and a TMDB-discovered one, say)
      # can independently resolve to the same tmdb_id once the line above
      # links them, and nothing before this step would notice. Safe to run
      # every night: a clean database just reports zero groups.
      - name: Reconcile duplicate calendar releases
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/reconcile_calendar_duplicates.py
